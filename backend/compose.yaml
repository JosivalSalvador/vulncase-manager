services:
  db:
    image: mysql:8.4
    container_name: vulncase-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE no .env}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - vulncase-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
  redis:
    image: redis:8-alpine
    container_name: vulncase-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

    # Banco só para os testes de integração. Não sobe com "docker compose up":
  # o "npm run test:integration" liga ele sozinho. Os dados ficam em memória
  # (tmpfs) e somem quando o container para. Os valores são fixos e falsos de
  # propósito, porque este banco nunca guarda nada de verdade.
  db-test:
    image: mysql:8.4
    container_name: vulncase-db-test
    profiles: ["test"]
    environment:
      MYSQL_ROOT_PASSWORD: test
      MYSQL_DATABASE: vulncase_test
      MYSQL_USER: test
      MYSQL_PASSWORD: test
    ports:
      - "127.0.0.1:3307:3306"
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  vulncase-db-data: